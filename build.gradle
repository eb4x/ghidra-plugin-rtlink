// Builds a Ghidra Extension for a given Ghidra installation.
//
// An absolute path to the Ghidra installation directory must be supplied either by setting the
// GHIDRA_INSTALL_DIR environment variable or Gradle project property:
//
//     > export GHIDRA_INSTALL_DIR=<Absolute path to Ghidra>
//     > gradle
//
//         or
//
//     > gradle -PGHIDRA_INSTALL_DIR=<Absolute path to Ghidra>
//
// Gradle should be invoked from the directory of the project to build.  Please see the
// application.gradle.version property in <GHIDRA_INSTALL_DIR>/Ghidra/application.properties
// for the correction version of Gradle to use for the Ghidra installation you specify.

//----------------------START "DO NOT MODIFY" SECTION------------------------------
def ghidraInstallDir

if (System.env.GHIDRA_INSTALL_DIR) {
	ghidraInstallDir = System.env.GHIDRA_INSTALL_DIR
}
else if (project.hasProperty("GHIDRA_INSTALL_DIR")) {
	ghidraInstallDir = project.getProperty("GHIDRA_INSTALL_DIR")
}
else {
	ghidraInstallDir = "<REPLACE>"
}

task distributeExtension {
	group = "Ghidra"

	apply from: new File(ghidraInstallDir).getCanonicalPath() + "/support/buildExtension.gradle"
	dependsOn ':buildExtension'
}
//----------------------END "DO NOT MODIFY" SECTION-------------------------------

repositories {
	mavenCentral()
}

// The smoke-test script is a development aid, not part of the shipped extension.
buildExtension.exclude 'ghidra_scripts/**'
// Keep project/dev clutter out of the packaged extension.
buildExtension.exclude '.github/**'
buildExtension.exclude '.claude/**'
buildExtension.exclude 'gradle/**'
buildExtension.exclude 'gradlew'
buildExtension.exclude 'gradlew.bat'
buildExtension.exclude '.gitignore'
buildExtension.exclude '.settings/**'
buildExtension.exclude '.project'
buildExtension.exclude '.classpath'
buildExtension.exclude 'docs/**'
// Local, machine-specific: the extracted Ghidra install we compile against and
// the gradle.properties pointing at it. Never ship these in the extension.
buildExtension.exclude 'ghidra-sdk/**'
buildExtension.exclude 'gradle.properties'

dependencies {
	// AbstractGenericTest and ProgramBuilder ship in Ghidra's own jars (Generic/Base),
	// which buildExtension.gradle already puts on the classpath; only JUnit is ours.
	testImplementation 'junit:junit:4.13.2'
}

/**
 * Convenience tasks for local development:
 * - `gradlew buildExtension` creates the extension zip in `dist/`
 * - `gradlew installExtension` unzips that extension into the Ghidra *user* Extensions folder,
 *   mirroring the Ghidra UI "Install Extensions" flow, and copies the zip into
 *   <GHIDRA_INSTALL_DIR>/Extensions/Ghidra.
 * - `gradlew uninstallExtension` removes both again.
 */
def extensionName = project.name

def ghidraUserExtensionsDir = {
	def overrideProp = project.findProperty("GHIDRA_USER_EXTENSIONS_DIR")
	if (overrideProp) {
		return file(overrideProp.toString())
	}
	def overrideEnv = System.getenv("GHIDRA_USER_EXTENSIONS_DIR")
	if (overrideEnv) {
		return file(overrideEnv)
	}

	def osName = (System.getProperty("os.name") ?: "").toLowerCase(Locale.ROOT)
	def ghidraUserProfileDirName = "${DISTRO_PREFIX}_${RELEASE_NAME}"

	if (osName.contains("windows")) {
		def appData = System.getenv("APPDATA")
		if (appData) {
			return file("${appData}/ghidra/${ghidraUserProfileDirName}/Extensions")
		}
	}

	if (osName.contains("mac") || osName.contains("darwin")) {
		return file("${System.getProperty('user.home')}/Library/ghidra/${ghidraUserProfileDirName}/Extensions")
	}

	def xdgConfigHome = System.getenv("XDG_CONFIG_HOME")
	def linuxConfigDir = xdgConfigHome ?: "${System.getProperty('user.home')}/.config"
	return file("${linuxConfigDir}/ghidra/${ghidraUserProfileDirName}/Extensions")
}.call()

def ghidraInstallExtensionsZipDir = file("${ghidraInstallDir}/Extensions/Ghidra")

def buildZipProvider = tasks.named('buildExtension', Zip).flatMap { it.archiveFile }

def extensionZipGlob = "*_${extensionName}.zip"
def installZipDropFileTree = fileTree(ghidraInstallExtensionsZipDir) { include extensionZipGlob }

tasks.register('cleanExtractedExtension', Delete) {
	group = "Ghidra"
	description = "Delete the extracted extension from Ghidra's user Extensions folder"
	delete new File(ghidraUserExtensionsDir, extensionName)
}

tasks.register('cleanCopiedExtensionZips', Delete) {
	group = "Ghidra"
	description = "Delete copied extension zip(s) from the Ghidra install Extensions/Ghidra folder"
	delete installZipDropFileTree
}

tasks.register('copyExtensionZip', Copy) {
	group = "Ghidra"
	description = "Copy the built extension zip into the Ghidra install Extensions/Ghidra folder"

	dependsOn tasks.named('buildExtension'), tasks.named('cleanCopiedExtensionZips')

	from(buildZipProvider)
	into ghidraInstallExtensionsZipDir
}

tasks.register('extractExtension', Copy) {
	group = "Ghidra"
	description = "Extract the built extension into Ghidra's user Extensions folder"

	dependsOn tasks.named('buildExtension'), tasks.named('cleanExtractedExtension')

	from {
		zipTree(buildZipProvider.get().asFile)
	}
	into ghidraUserExtensionsDir
}

tasks.register('installExtension') {
	group = "Ghidra"
	description = "Copy the zip to the Ghidra install and extract into the user Extensions folder"
	dependsOn tasks.named('copyExtensionZip'), tasks.named('extractExtension')
}

tasks.register('uninstallExtension') {
	group = "Ghidra"
	description = "Delete the extracted extension and remove copied extension zip(s)"
	dependsOn tasks.named('cleanExtractedExtension'), tasks.named('cleanCopiedExtensionZips')
}

/**
 * Headless smoke test (`gradlew smokeTest`), hermetic by construction (same shape as
 * ghidra-plugin-mcp's): headless loads extensions extracted under <install>/Ghidra/Extensions,
 * so re-extract the freshly built zip there on every run, and pin the settings dir into
 * build/ via -Dapplication.settingsdir so ~/.config/ghidra stays out of it. The target
 * binary is an RTLink-linked overlay EXE from the RTLTEST harness; the post-script asserts
 * overlay blocks and resolved stubs, and prints its own verdict because analyzeHeadless
 * exits 0 even when a postScript throws.
 */
def ghidraInstallExtensionsDir = file("${ghidraInstallDir}/Ghidra/Extensions")
def smokeDir = file("${layout.buildDirectory.get().asFile}/smoke")
def smokeTarget = (project.findProperty("SMOKE_TARGET")
	?: "${System.getProperty('user.home')}/dosbox/MPS/COLONIZE/VICEROY.EXE").toString()

tasks.register('cleanInstalledExtension', Delete) {
	group = "Ghidra"
	description = "Delete the extension extracted inside the Ghidra install (headless loads it)"
	delete new File(ghidraInstallExtensionsDir, extensionName)
}

tasks.register('extractExtensionToInstall', Copy) {
	group = "Ghidra"
	description = "Extract the built extension into the Ghidra install, where headless finds it"

	dependsOn tasks.named('buildExtension'), tasks.named('cleanInstalledExtension')

	from {
		zipTree(buildZipProvider.get().asFile)
	}
	into ghidraInstallExtensionsDir
}

tasks.register('smokeTest', Exec) {
	group = "verification"
	description = "Headless-import an RTLink overlay EXE with the freshly built extension and assert overlays"

	dependsOn tasks.named('extractExtensionToInstall')

	def projectDir = new File(smokeDir, "project")
	def settingsDir = new File(smokeDir, "settings")
	def logFile = new File(smokeDir, "smoke.log")

	doFirst {
		delete smokeDir
		projectDir.mkdirs()
		settingsDir.mkdirs()
		if (!file(smokeTarget).exists()) {
			throw new GradleException("smoke target not found: ${smokeTarget} (set -PSMOKE_TARGET=...)")
		}
	}

	environment 'GHIDRA_JAVA_OPTIONS', "-Dapplication.settingsdir=${settingsDir}"
	commandLine "${ghidraInstallDir}/support/analyzeHeadless",
		projectDir, "smoke",
		"-import", smokeTarget,
		"-scriptPath", file("ghidra_scripts"),
		"-postScript", "RTLinkSmokeScript"

	ignoreExitValue = true
	standardOutput = new ByteArrayOutputStream()
	errorOutput = standardOutput

	doLast {
		def output = standardOutput.toString()
		logFile.text = output
		def unexpected = (output =~ /(?m)^.*UNEXPECTED.*$/).collect { it }
		if (!output.contains("SMOKE COMPLETE") || !unexpected.isEmpty()) {
			throw new GradleException("smoke test failed — see ${logFile}\n" +
				(unexpected.isEmpty() ? "script did not reach SMOKE COMPLETE"
					: unexpected.join("\n")))
		}
		def version = file("version.properties").readLines()
			.find { it.startsWith("version=") }?.substring("version=".length())
		logger.lifecycle("smoke test passed (extension ${version}) — full log: ${logFile}")
	}
}
